<!-- The app is light unless dark is chosen in Settings: a system in dark mode alone doesn't change it. A browser that darkens
     websites by force ("darken websites" in Chrome, "dark sites" in Samsung Internet) gets the app's own dark theme instead of its
     guesswork: Chrome shows it by painting the "canvas" colour dark on an element that asks for a light scheme. Then the page
     says "only <theme>", which keeps the forced darkening off, so a dark theme isn't darkened a second time. -->
<script>(function () {
  var d = document.documentElement, t, forced = false;
  try { t = JSON.parse(localStorage.getItem("rac.theme")); } catch (e) {}
  try {
    var probe = d.appendChild(document.createElement("div"));
    probe.style.cssText = "display:none;background-color:canvas;color-scheme:light";
    forced = getComputedStyle(probe).backgroundColor !== "rgb(255, 255, 255)";
    probe.remove();
  } catch (e) {}
  if (t !== "dark" && t !== "light") t = forced ? "dark" : "light";
  d.dataset.theme = t;
  if (forced) d.dataset.forcedDark = "";
  // the developer screen's dark mode check tries other declarations here, at load, where a browser decides (#/dev/dark)
  var o = "", rule = false;
  try { if (JSON.parse(localStorage.getItem("rac.dev"))) { o = JSON.parse(localStorage.getItem("rac.devScheme")) || ""; rule = JSON.parse(localStorage.getItem("rac.devSchemeRule")) === true; } } catch (e) {}
  if (o) d.style.colorScheme = o;
  if (rule) document.head.appendChild(document.createElement("style")).textContent = "@media (prefers-color-scheme: dark) { :root { --dev-scheme-rule: 1; } }";
  if (o === "normal") return;
  var m = document.head.appendChild(document.createElement("meta"));
  m.name = "color-scheme"; m.content = o || "only " + t;
})();</script>
<script type="module" src="./src/main.tsx"></script>

<body data-page="home">
<!-- the app renders into #root, which is display: contents (app.css): header#top, main, nav#tabs stay children of body for the CSS -->
<div id="root"></div>
